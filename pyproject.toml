[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "champions-rl"
version = "0.1.0"
description = "Offline Pokemon Champions Regulation M-C singles training"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "torch>=2.7", "gymnasium>=1.0"]

[project.scripts]
champions-rl = "champions_rl.cli:main"

[tool.setuptools.packages.find]
include = ["champions_rl*", "opponents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
